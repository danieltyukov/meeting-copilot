name: CI

# Standard GitHub-hosted runners only. Actions minutes are free and unmetered on
# a public repository with standard runners.

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

# A second push to the same branch cancels the first.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      # test_audio decodes a real WAV through ffmpeg, the way the app does.
      - name: ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress

      # The full dependency set, including faster-whisper and scikit-learn: the
      # tests never load a model, but the modules that would are imported.
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"

      - run: python -m pytest -q

      # The installer the README gives for each desktop, run as a user would,
      # then the command it puts on PATH. There is no microphone on a runner,
      # so --list-mics only has to finish without a traceback.
      - name: install.sh
        if: runner.os != 'Windows' && matrix.python == '3.12'
        run: |
          ./install.sh
          export PATH="$HOME/.local/bin:$PATH"
          meeting-copilot --version
          cd "$RUNNER_TEMP" && meeting-copilot --print-context | head -3
          out=$(meeting-copilot --list-mics 2>&1 || true); echo "$out"
          ! grep -q Traceback <<<"$out"
      - name: install.ps1
        if: runner.os == 'Windows' && matrix.python == '3.12'
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File install.ps1
          if ($LASTEXITCODE -ne 0) { Get-ChildItem -Force .venv, .venv\* -ErrorAction SilentlyContinue | Select-Object FullName; exit 1 }
          $env:Path = [Environment]::GetEnvironmentVariable("Path", "User") + ";" + $env:Path
          meeting-copilot --version
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Set-Location $env:RUNNER_TEMP
          meeting-copilot --print-context | Select-Object -First 3
          $out = (cmd /c "meeting-copilot --list-mics 2>&1") -join "`n"
          Write-Host $out
          if ($out -match "Traceback") { exit 1 }
          exit 0

  extension:
    name: Extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # No dependencies: the real scripts run in a vm context with a shimmed DOM.
      - run: node extension/test_render.cjs
      - run: node extension/test_history.cjs
      # Reads tests/name_cases.json, the same cases pytest runs against names.py.
      - run: node extension/test_names.cjs

      - name: Manifest is valid JSON
        run: node -e "JSON.parse(require('fs').readFileSync('extension/manifest.json','utf8'))"

  site:
    name: Site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Every local link and image on the site resolves
        run: |
          cd site
          fail=0
          for ref in $(grep -oE '(href|src)="[^"#:]+"' index.html | sed -E 's/^[^"]+"//; s/"$//' | sort -u); do
            [ -e "$ref" ] || { echo "missing: $ref"; fail=1; }
          done
          exit $fail
