name: CI

# Standard GitHub-hosted runners only. Actions minutes are free and unmetered on
# a public repository with standard runners.

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

# A second push to the same branch cancels the first.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      # The full dependency set, including faster-whisper and scikit-learn: the
      # tests never load a model, but the modules that would are imported.
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'

      - run: python -m pytest -q

  extension:
    name: Extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # No dependencies: the real scripts run in a vm context with a shimmed DOM.
      - run: node extension/test_render.cjs
      - run: node extension/test_history.cjs

      - name: Manifest is valid JSON
        run: node -e "JSON.parse(require('fs').readFileSync('extension/manifest.json','utf8'))"

  site:
    name: Site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Every local link and image on the site resolves
        run: |
          cd site
          fail=0
          for ref in $(grep -oE '(href|src)="[^"#:]+"' index.html | sed -E 's/^[^"]+"//; s/"$//' | sort -u); do
            [ -e "$ref" ] || { echo "missing: $ref"; fail=1; }
          done
          exit $fail
