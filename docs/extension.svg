<svg width="460" height="720" viewBox="0 0 460 720" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans Mono, monospace">
  <rect width="460" height="720" rx="16" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <!-- header -->
  <line x1="0" y1="44" x2="460" y2="44" stroke="#30363d"/>
  <circle cx="22" cy="22" r="6" fill="#f87171"/>
  <text x="36" y="27" font-size="14" fill="#e6edf3">recording</text>
  <circle cx="356" cy="22" r="5" fill="#34d399"/><text x="366" y="27" font-size="12" fill="#7d8590">you</text>
  <circle cx="406" cy="22" r="5" fill="#6e7681"/><text x="416" y="27" font-size="12" fill="#7d8590">them</text>

  <!-- transcript pane -->
  <rect x="12" y="56" width="436" height="206" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="24" y="76" font-size="10.5" fill="#7d8590">LIVE TRANSCRIPT</text>
  <text x="24" y="100" font-size="12.5"><tspan fill="#38bdf8" font-weight="bold">Speaker:</tspan><tspan fill="#e6edf3">&#160;Walk me through your gain</tspan></text>
  <text x="24" y="118" font-size="12.5" fill="#e6edf3">stage: why this topology?</text>
  <text x="24" y="142" font-size="12.5"><tspan fill="#34d399" font-weight="bold">Me:</tspan><tspan fill="#e6edf3">&#160;Sure, let me explain the trade-offs.</tspan></text>
  <text x="24" y="172" font-size="12.5"><tspan fill="#38bdf8" font-weight="bold">Speaker:</tspan><tspan fill="#e6edf3">&#160;And how does that affect</tspan></text>
  <text x="24" y="190" font-size="12.5" fill="#e6edf3">your phase margin?</text>
  <text x="24" y="220" font-size="12.5" font-style="italic" fill="#7d8590">Me: Right, so the dominant pole sits ▌</text>

  <!-- answer pane -->
  <rect x="12" y="274" width="436" height="252" rx="10" fill="#161b22" stroke="#FFC61A"/>
  <text x="24" y="294" font-size="10.5" fill="#7d8590">READ THIS ALOUD</text>
  <text x="24" y="316" font-size="11.5" font-style="italic" fill="#7d8590">Q: Walk me through your gain stage…</text>
  <g font-size="13.5" fill="#e6edf3">
    <text x="24" y="342">We went with a telescopic cascode for the</text>
    <text x="24" y="362">gain stage: it gives the output impedance</text>
    <text x="24" y="382">we needed for loop gain without burning</text>
    <text x="24" y="402">extra current.</text>
    <text x="24" y="430">I did prototype a single PMOS stage first</text>
    <text x="24" y="450">(it's in the repo as single_pmos.cir) but it</text>
    <text x="24" y="470">fell short on gain. A folded cascode buys</text>
    <text x="24" y="490">headroom but complicates compensation, so</text>
    <text x="24" y="510">for our supply it wasn't worth it.</text>
  </g>

  <!-- controls -->
  <rect x="12" y="540" width="436" height="34" rx="7" fill="#0d1117" stroke="#30363d"/>
  <text x="24" y="561" font-size="12" fill="#7d8590">optional: steer the next answer…</text>
  <rect x="12" y="584" width="120" height="34" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="34" y="606" font-size="13" fill="#e6edf3">Start</text>
  <rect x="140" y="584" width="120" height="34" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="160" y="606" font-size="13" fill="#7d8590">Stop</text>
  <rect x="268" y="584" width="180" height="34" rx="8" fill="#3a2f08" stroke="#FFC61A"/>
  <text x="322" y="606" font-size="13" fill="#fde68a">Help</text>

  <text x="24" y="648" font-size="12" fill="#7d8590">▸ Your context (pasted)</text>
  <text x="24" y="672" font-size="12" fill="#7d8590">▸ Settings (Deepgram + Anthropic keys)</text>

  <line x1="0" y1="690" x2="460" y2="690" stroke="#30363d"/>
  <text x="16" y="708" font-size="10.5" fill="#7d8590">Visible aid · not hidden from screen share · use with consent.</text>
</svg>
